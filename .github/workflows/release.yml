# Publish the launcher when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The asset name is fixed as EmbervaleLauncher.exe so the website can link to
# /releases/latest/download/EmbervaleLauncher.exe and never be edited again.

name: release

on:
  push:
    tags: ["v*"]
  # Buildable by hand as well, to check the workflow without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Run before building the thing people download, not after.
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Name it what the site links to
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/embervale-launcher.exe dist/EmbervaleLauncher.exe
          ls -la dist/

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API answers 5xx often enough to matter: v0.1.2 built
          # cleanly and then died here on a 503, throwing away six minutes of
          # compute for a fault that had nothing to do with the build. Both
          # calls below are safe to repeat, so repeat them.
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt $attempt of 5 failed, retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            echo "::error::gave up after 5 attempts"
            return 1
          }

          # No existence check first: a 404 from one and a 503 from the other
          # are indistinguishable by exit code, so a check that retried would
          # spend a minute failing on every genuinely new tag. Creating and
          # forgiving the one error that means "nothing to do" is cheaper.
          #
          # --latest is asserted rather than left to default: the game ships
          # from this repository too, onto the `live` tag, and the website's
          # download link resolves through /releases/latest/. Whichever release
          # is newest by date would otherwise take it.
          create() {
            local out
            if out=$(gh release create "$GITHUB_REF_NAME" \
                       --title "Embervale launcher $GITHUB_REF_NAME" \
                       --latest \
                       --notes "Download EmbervaleLauncher.exe and run it." 2>&1); then
              return 0
            fi
            if grep -qi 'already exists' <<<"$out"; then
              echo "release $GITHUB_REF_NAME already exists"
              return 0
            fi
            echo "$out" >&2
            return 1
          }

          retry create
          retry gh release upload "$GITHUB_REF_NAME" dist/EmbervaleLauncher.exe --clobber

      - name: Keep the build when there is no tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: EmbervaleLauncher
          path: dist/EmbervaleLauncher.exe
