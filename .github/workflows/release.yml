# Publish the launcher when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The asset name is fixed as EmbervaleLauncher.exe so the website can link to
# /releases/latest/download/EmbervaleLauncher.exe and never be edited again.

name: release

on:
  push:
    tags: ["v*"]
  # Buildable by hand as well, to check the workflow without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Run before building the thing people download, not after.
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Name it what the site links to
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/embervale-launcher.exe dist/EmbervaleLauncher.exe
          ls -la dist/

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist -- the client repo's workflow does not
          # create it, but a re-run of this one would.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "Embervale launcher $GITHUB_REF_NAME" \
                 --notes "Download EmbervaleLauncher.exe and run it."
          gh release upload "$GITHUB_REF_NAME" dist/EmbervaleLauncher.exe --clobber

      - name: Keep the build when there is no tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: EmbervaleLauncher
          path: dist/EmbervaleLauncher.exe
